version: "3.9"

services:
  frontend:
    image: node:24-alpine
    working_dir: /app
    command:
      - sh
      - -c
      - |
        printf '{"\/api":{"target":"http://backend:5135","secure":false,"changeOrigin":true}}' > /tmp/proxy.conf.json
        npm ci
        npm start -- --host 0.0.0.0 --proxy-config /tmp/proxy.conf.json
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  backend:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /src
    command:
      - dotnet
      - run
      - --project
      - CampusConnect.API/CampusConnect.API.csproj
      - --urls
      - http://0.0.0.0:5135
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CampusConnect: Data Source=/data/campusconnect.db
      Jwt__Secret: ${JWT_SECRET:-development-only-secret-change-me-1234567890}
    ports:
      - "5135:5135"
    volumes:
      - ./backend:/src
      - backend_nuget:/root/.nuget/packages
      - database_data:/data
    depends_on:
      database:
        condition: service_completed_successfully

  database:
    image: alpine:3.22
    command:
      - sh
      - -c
      - touch /data/campusconnect.db
    volumes:
      - database_data:/data

volumes:
  frontend_node_modules:
  backend_nuget:
  database_data:
