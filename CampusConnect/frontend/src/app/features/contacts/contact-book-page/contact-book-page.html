<div class="contact-book-page">
  <header class="contact-book-page__header">
    <div>
      <p>{{ 'contacts.label' | translate }}</p>
      <h1>{{ 'contacts.header' | translate }}</h1>
    </div>
    <span>{{ 'contacts.headerBadge' | translate }}</span>
  </header>

  <section class="contact-book-page__content">
    <app-contact-search-card (searchOpen)="openSearch()" />
    <app-favorites-dropdown [favorites]="_favoriteContacts()" (favoriteToggle)="toggleFavorite($event)" />
  </section>

  <app-contact-search-modal [favoriteIds]="_favoriteIds()" [isOpen]="_isSearchOpen()" (closed)="closeSearch()" (favoriteToggle)="toggleFavorite($event)" />
</div>
