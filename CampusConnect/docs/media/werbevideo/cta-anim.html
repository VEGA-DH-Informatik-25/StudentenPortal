<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  :root{--red:#c1121f;--red-dark:#8e0d17;--ink:#0f172a;--muted:#52617a;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1920px;height:1080px;overflow:hidden;}
  body{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    background:radial-gradient(130% 130% at 50% -20%, #ffffff 0%, #eef2f6 55%, #e0e6ec 100%);
    position:relative;display:flex;align-items:center;justify-content:center;}
  .ac1{position:absolute;top:-280px;left:-220px;width:760px;height:760px;border-radius:90px;
    background:linear-gradient(135deg,var(--red),var(--red-dark));transform:rotate(28deg);opacity:.08;}
  .ac2{position:absolute;bottom:-320px;right:-220px;width:820px;height:820px;border-radius:100px;
    background:var(--red);transform:rotate(20deg);opacity:.07;}
  .topbar{position:absolute;top:0;left:0;width:100%;height:10px;background:var(--red);}
  .wrap{position:relative;z-index:2;text-align:center;}
  .name{font-size:120px;font-weight:850;color:var(--ink);letter-spacing:-2px;opacity:0;}
  .name b{color:var(--red);}
  .tag{font-size:44px;font-weight:600;color:var(--muted);margin-top:14px;margin-bottom:54px;opacity:0;}
  .btn{display:inline-block;background:linear-gradient(180deg,var(--red),var(--red-dark));color:#fff;
    font-size:40px;font-weight:800;padding:28px 72px;border-radius:999px;letter-spacing:.5px;
    box-shadow:0 22px 46px rgba(193,18,31,.40);opacity:0;}
  .mail{margin-top:30px;font-size:31px;color:var(--ink);font-weight:600;opacity:0;}
  .mail span{color:var(--red);font-weight:800;}
  .foot{position:absolute;bottom:70px;left:0;width:100%;text-align:center;
    font-size:27px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--muted);opacity:0;}
  .foot b{color:var(--ink);}
</style>
</head>
<body>
  <div class="topbar"></div>
  <div class="ac1"></div><div class="ac2"></div>
  <div class="wrap">
    <div class="name" id="name">Campus<b>Connect</b></div>
    <div class="tag" id="tag">Dein digitaler Campus.</div>
    <div class="btn" id="btn">Jetzt anmelden</div>
  </div>
  <div class="foot" id="foot">Für&nbsp;Laptop&nbsp;&amp;&nbsp;Tablet&nbsp;&nbsp;·&nbsp;&nbsp;<b>DHBW&nbsp;Lörrach</b></div>
<script>
const EASE="cubic-bezier(.22,.61,.36,1)";
function up(el,delay,dy){el.animate([{opacity:0,transform:`translateY(${dy}px)`},{opacity:1,transform:"translateY(0)"}],
  {duration:620,delay,easing:EASE,fill:"both"});}
function pop(el,delay){el.animate([{opacity:0,transform:"scale(.8)"},{opacity:1,transform:"scale(1)"}],
  {duration:560,delay,easing:"cubic-bezier(.34,1.56,.64,1)",fill:"both"});}
up(document.getElementById("name"),120,40);
up(document.getElementById("tag"),320,30);
pop(document.getElementById("btn"),560);
up(document.getElementById("foot"),900,16);
window.__sceneReady=true;
</script>
</body>
</html>
